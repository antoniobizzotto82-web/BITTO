workflows:
  android-bitto-tv:
    name: BITTO-TV 2026 Android
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.bittotv.app"

    scripts:
      - name: Build debug APK
        script: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle assembleDebug
          else
            ./gradlew assembleDebug
          fi

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
